  function lifecycleClass(status,submission){
    const s=(status||'').toLowerCase(), sub=(submission||'').toLowerCase();

  function stockState(product){
    const s=product?.stock||{};
    const balances=[s.AL8?.balance,s.AL2?.balance,s.AL3?.balance].map(safeNum);
    if(balances.some(n=>n>0)) return 'In Stock';
    const inbound=[s.AL8?.incoming,s.AL2?.inTransit,s.AL2?.pending,s.AL3?.inTransit,s.AL3?.pending].map(safeNum);
    if(inbound.some(n=>n>0)) return 'Incoming';
    const back=[s.AL8?.backorder,s.AL2?.backorder,s.AL3?.backorder].map(safeNum);
    if(back.some(n=>n>0)||balances.some(n=>n<0)) return 'Backorder / No Stock';
    return 'No Stock';
  }
  function stockClass(st){ return st==='In Stock'?'green':st==='Incoming'?'blue':st.startsWith('Backorder')?'amber':'gray'; }
  function lifecycleFilterKey(p){
    const s=String(p?.lifecycleStatus||'').toLowerCase();
    const sub=String(p?.submissionStatus||'').toLowerCase();
    if(s.includes('current')) return 'current';
    if(s.includes('npi')) return 'npi';

    return 'other';
  }
  function lifecycleRank(p){
    const s=String(p?.lifecycleStatus||'').toLowerCase();
    const sub=String(p?.submissionStatus||'').toLowerCase();
    if(s.includes('current')) return 0;
    if(s.includes('npi')) return 1;
    if(s.includes('discontinued')||sub.includes('stop')) return 3;
    return 2;
  }
  function stockRank(p){
    const st=stockState(p);
    if(st==='In Stock') return 0;

  }
  function productSortCompare(a,b,mode='priority'){
    const codeCmp=String(a.code||'').localeCompare(String(b.code||''));
    const catCmp=String(a.category||'').localeCompare(String(b.category||''));
    if(mode==='availability'){
      return stockRank(a)-stockRank(b) || lifecycleRank(a)-lifecycleRank(b) || catCmp || codeCmp;
    }
    if(mode==='lifecycle'){
      return lifecycleRank(a)-lifecycleRank(b) || stockRank(a)-stockRank(b) || catCmp || codeCmp;
    }
    if(mode==='model') return codeCmp;
    if(mode==='category') return catCmp || lifecycleRank(a)-lifecycleRank(b) || stockRank(a)-stockRank(b) || codeCmp;
    // Recommended priority: Current first, then NPI/other, Discontinued last;
    // inside each lifecycle group, In Stock first and No Stock last.
    return lifecycleRank(a)-lifecycleRank(b) || stockRank(a)-stockRank(b) || catCmp || codeCmp;
  }

        text += '\n' + tc.items.map(x=>x.str).join(' ');
      }
      const detectedModels=detectModelCodes(text);

      pendingDocImport={fileName:file.name,type,pages:pdf.numPages,detectedModels,signals,importedAt:nowIso(),_file:file};

  function detectModelCodes(text){
    const set=new Set(); const patterns=[/\b[A-Z0-9]{2,}(?:-[A-Z0-9]+)*(?:\.[A-Z0-9]+)+\b/g,/\b(?:S3-[A-Z0-9-]+|GC-[A-Z0-9-]+|GN-[A-Z0-9-]+|GV-[A-Z0-9-]+|FX[A-Z0-9-]+|FV[A-Z0-9-]+|F\d[A-Z0-9-]+|RX[A-Z0-9-]+|TX[A-Z0-9-]+|TV[A-Z0-9-]+|WT[A-Z0-9-]+|WD[A-Z0-9-]+|WU[A-Z0-9-]+|AS[A-Z0-9-]+|DFC[A-Z0-9-]+)\b/g];
    for(const re of patterns){ for(const m of text.matchAll(re)) set.add(normModel(m[0])); }
    return [...set].sort();
  }
  function detectPromoSignals(text){
    const compact=String(text||'').replace(/\s+/g,' '); const found=new Set();
    const regs=[/\b\d{1,2}%\s*(?:OFF|off)?[^.]{0,45}?(?:\d{1,2}\s*(?:M|MONTH|MONTHS|Ms))/gi,/\bRM\s*\d+(?:\.\d+)?\s*OFF\b[^.]{0,60}/gi,/\b(?:1st|1|01)[^\n]{0,20}(?:Oct|October|Nov|November|Dec|December)[^\n]{0,45}(?:31st|31|30th|30|15th|15)[^\n]{0,20}(?:Oct|October|Nov|November|Dec|December)[^\n]{0,10}20\d{2}/gi,/\bFREE\s+(?:LG\s+)?\d{2}[”\"']?\s*INCH[^.]{0,80}/gi];
    for(const re of regs){ for(const m of compact.matchAll(re)){ const v=m[0].trim(); if(v.length<140) found.add(v); } }
    return [...found].slice(0,30);
  }

      diff.forEach(c=>selected[c.model]=c.type!=='missing');

  function parseStockWorkbook(wb,fileName){
    const availableSheet=wb.Sheets['Available Sum'];
    const portfolioSheet=wb.Sheets['Portfolio Status'];
    if(!availableSheet||!portfolioSheet) throw new Error('Required sheets “Available Sum” and/or “Portfolio Status” were not found.');
    const av=XLSX.utils.sheet_to_json(availableSheet,{header:1,defval:null,raw:true});
    const pf=XLSX.utils.sheet_to_json(portfolioSheet,{header:1,defval:null,raw:true});
    const reportCell=av?.[0]?.[3] ?? pf?.[0]?.[1] ?? null;
    const reportDate=excelDateToIso(reportCell) || nowIso();
    const products={}, rejectedRows=[];

    function findHeader(rows){
      for(let i=0;i<Math.min(rows.length,80);i++){
        const row=rows[i]||[];
        const lower=row.map(v=>String(v??'').trim().toLowerCase());
        const modelIdx=lower.findIndex(v=>v==='model'||v==='model code'||v==='modelcode');
        const catIdx=lower.findIndex(v=>v==='category'||v==='product category');
        if(modelIdx>=0 && catIdx>=0) return {row:i,modelIdx,catIdx,lower};
      }
      return null;
    }
    function stockAt(r,idx){ return idx>=0 && idx<r.length ? stockQty(r[idx]) : 0; }

    const ah=findHeader(av);
    if(!ah) throw new Error('Could not locate Category / Model header in “Available Sum”.');
    let cat='';
    for(let i=ah.row+1;i<av.length;i++){
      const r=av[i]||[];
      if(validStockCategory(r[ah.catIdx])) cat=normalizeCategory(r[ah.catIdx]);
      const raw=r[ah.modelIdx], code=normModel(raw);
      if(!code) continue;
      if(!validStockModelCode(code)){
        if(String(raw??'').trim()) rejectedRows.push({sheet:'Available Sum',row:i+1,value:String(raw)});
        continue;
      }

      // The recurring LG stock report keeps the regional stock blocks at fixed
      // offsets from the Model column even when leading columns shift.
      const m=ah.modelIdx;
      products[code]=Object.assign({},products[code]||{},{
        code,category:cat||products[code]?.category||'',
        stock:{
          AL8:{
            opening:stockAt(r,m+1),
            incoming:stockAt(r,m+2),
            backorder:stockAt(r,m+3),
            currentOrders:stockAt(r,m+4),
            balance:stockAt(r,m+5)
          },
          AL2:{
            opening:stockAt(r,m+18),
            inTransit:stockAt(r,m+19),
            pending:stockAt(r,m+20),
            backorder:stockAt(r,m+21),
            currentOrders:stockAt(r,m+22),
            balance:stockAt(r,m+23)
          },
          AL3:{
            opening:stockAt(r,m+24),
            inTransit:stockAt(r,m+25),
            pending:stockAt(r,m+26),
            backorder:stockAt(r,m+27),
            currentOrders:stockAt(r,m+28),
            balance:stockAt(r,m+29)
          }
        }
      });
    }

    const ph=findHeader(pf);
    if(!ph) throw new Error('Could not locate Category / Model header in “Portfolio Status”.');
    cat='';
    for(let i=ph.row+1;i<pf.length;i++){
      const r=pf[i]||[];
      if(validStockCategory(r[ph.catIdx])) cat=normalizeCategory(r[ph.catIdx]);
      const raw=r[ph.modelIdx], code=normModel(raw);
      if(!code) continue;
      if(!validStockModelCode(code)){
        if(String(raw??'').trim()) rejectedRows.push({sheet:'Portfolio Status',row:i+1,value:String(raw)});
        continue;
      }
      products[code]=products[code]||{code,category:cat,stock:{AL8:{},AL2:{},AL3:{}}};
      if(cat) products[code].category=cat;

      const descIdx=ph.lower.findIndex(v=>v==='description'||v==='product description');
      const lifeIdx=ph.lower.findIndex(v=>v.includes('portfolio')||v.includes('lifecycle'));
      const submitIdx=ph.lower.findIndex(v=>v.includes('submission'));
      products[code].description=String(r[descIdx>=0?descIdx:ph.modelIdx+1]||'').trim();
      products[code].lifecycleStatus=String(r[lifeIdx>=0?lifeIdx:ph.modelIdx+2]||'').trim();
      products[code].submissionStatus=String(r[submitIdx>=0?submitIdx:ph.modelIdx+3]||'').trim();
    }
    return {sourceReport:fileName,reportDate,products,rejectedRows};
  }
  function excelDateToIso(v){
    if(!v) return null;
    if(v instanceof Date && !Number.isNaN(v.getTime())) return v.toISOString();
    if(typeof v==='number'){
      const ms=Math.round((v-25569)*86400*1000); const d=new Date(ms); return Number.isNaN(d.getTime())?null:d.toISOString();
    }
    const d=new Date(v); return Number.isNaN(d.getTime())?null:d.toISOString();
  }
  function compareImport(parsed){
    const changes=[]; const old=state.products||{}; const next=parsed.products||{};
    const all=new Set([...Object.keys(old),...Object.keys(next)]);
    all.forEach(code=>{
      const a=old[code],b=next[code];
      if(!a && b){ changes.push({model:code,type:'new-model',summary:`New model detected • ${b.lifecycleStatus||'status not specified'}`}); return; }
      if(a && !b){ changes.push({model:code,type:'missing',summary:'Model is no longer present in the new report'}); return; }
      const parts=[];
      if((a.lifecycleStatus||'')!==(b.lifecycleStatus||'')) parts.push(`Lifecycle: ${a.lifecycleStatus||'—'} → ${b.lifecycleStatus||'—'}`);
      if((a.submissionStatus||'')!==(b.submissionStatus||'')) parts.push(`Submission: ${a.submissionStatus||'—'} → ${b.submissionStatus||'—'}`);
      const oldSt=stockState(a),newSt=stockState(b);
      if(oldSt!==newSt) parts.push(`Stock: ${oldSt} → ${newSt}`);
      const oldBal=[a.stock?.AL8?.balance,a.stock?.AL2?.balance,a.stock?.AL3?.balance].map(safeNum).join('/');
      const newBal=[b.stock?.AL8?.balance,b.stock?.AL2?.balance,b.stock?.AL3?.balance].map(safeNum).join('/');
      if(oldBal!==newBal) parts.push(`Balance AL8/AL2/AL3: ${oldBal} → ${newBal}`);
      if(parts.length) changes.push({model:code,type:'changed',summary:parts.join(' • ')});
    });
    return changes;
  }

  async function applyPendingImport(){
    if(!pendingImport) return;
    const opt=pendingImport.options||{stock:true,lifecycle:true,newModels:true,missing:false};
    const relevant=c=>{
      if(c.type==='new-model') return opt.newModels;
      if(c.type==='missing') return opt.missing;
      const s=c.summary||'', life=s.includes('Lifecycle')||s.includes('Submission'), stock=s.includes('Stock:')||s.includes('Balance');
      return (life&&opt.lifecycle)||(stock&&opt.stock);
    };
    const chosen=(pendingImport.diff||[]).filter(c=>pendingImport.selected[c.model]&&relevant(c));
    if(!chosen.length){toast('No applicable changes selected.');return;}
    let cloudSourcePath=null; try{cloudSourcePath=await cloudUploadSourceFile(pendingImport.file,'stock')}catch(e){console.warn(e)}
    const parsed=pendingImport.parsed, old=state.products||{}, next={...old};
    chosen.forEach(change=>{
      const code=change.model, incoming=parsed.products[code], prev=old[code]||{};
      if(change.type==='missing'){
        if(opt.missing && prev.code) next[code]={...prev,reportMissing:true,updatedAt:nowIso()};
        return;
      }
      if(!incoming || !validStockModelCode(code)) return;
      const merged={...prev,code};
      if(incoming.category) merged.category=incoming.category;
      if(opt.stock && incoming.stock) merged.stock=incoming.stock;
      if(opt.lifecycle){
        if('description' in incoming) merged.description=incoming.description;
        if('lifecycleStatus' in incoming) merged.lifecycleStatus=incoming.lifecycleStatus;
        if('submissionStatus' in incoming) merged.submissionStatus=incoming.submissionStatus;
      }
      merged.dimensions=prev.dimensions||{width:null,height:null,depth:null};
      merged.imageApproved=!!prev.imageApproved; merged.reportMissing=false; merged.updatedAt=nowIso();
      next[code]=merged;
    });
    Object.keys(next).forEach(code=>{ if(!validStockModelCode(code)) delete next[code]; });
    state.products=next; state.sourceReport=parsed.sourceReport; state.reportDate=parsed.reportDate;
    const changes=chosen.map(c=>({...c,at:nowIso()}));
    state.changeLog=[...(state.changeLog||[]),...changes].slice(-500);
    const visual=changes.filter(c=>c.type==='missing'||(c.summary||'').includes('Lifecycle')||(c.summary||'').includes('Submission'));
    markPostersOutdated(visual.map(x=>x.model),visual);
    state.importHistory=state.importHistory||[];
    state.importHistory.push({id:uid('import'),fileName:pendingImport.fileName,reportDate:parsed.reportDate,appliedAt:nowIso(),changeCount:changes.length,rejectedRows:(parsed.rejectedRows||[]).length,storagePath:cloudSourcePath});
    pendingImport=null; saveState(); toast(`Selected update applied to ${changes.length} model${changes.length===1?'':'s'}.`); render();
  }

    await drawTemplateBackground(ctx,'kitchen');await drawBrand(ctx);const codes=[posterDraft.model1,posterDraft.model2],imgs=await Promise.all(codes.map(c=>c?assetImage(c):null)),dims=imgs.map((im,i)=>dimsFor(codes[i],im));ctx.fillStyle='#111';ctx.font='900 62px system-ui';ctx.fillText((posterDraft.title||tr('BUILD YOUR HOME COMBO','PAKEJ KOMBO RUMAH')).toUpperCase(),70,242);ctx.fillStyle='#c40025';ctx.font='800 36px system-ui';ctx.fillText(tr('INDIVIDUAL PRICES + COMBINED TOTAL','HARGA INDIVIDU + JUMLAH KOMBO'),73,296);
    const gap=36,cardW=730;for(let i=0;i<2;i++){const x=52+i*(cardW+gap);ctx.fillStyle='rgba(255,255,255,.94)';roundRect(ctx,x,335,cardW,880,32,true);ctx.fillStyle='#111';ctx.font='900 34px system-ui';ctx.fillText(autoName(codes[i]),x+34,392);ctx.fillStyle='#c40025';ctx.font='900 37px system-ui';ctx.fillText(modelShort(codes[i]),x+34,438);await drawPhysicalProduct(ctx,imgs[i],dims[i],x+80,470,cardW-160,500);drawIndividualPlans(ctx,codes[i],x+36,1010,cardW-72);}
    drawCrossTotals(ctx,codes);drawContactFooter(ctx,1484);
  }
  function drawIndividualPlans(ctx,code,x,y,w){
    const rows=[];if(posterDraft.show5)rows.push([5,findPlan(code,5,'combine')||findPlan(code,5,'')]);if(posterDraft.show7)rows.push([7,findPlan(code,7,'combine')||findPlan(code,7,'')]);let yy=y;for(const [yr,p] of rows){ctx.fillStyle='#222';ctx.font='800 21px system-ui';ctx.fillText(`${yr}Y`,x,yy);if(!p){ctx.fillStyle='#9a6700';ctx.fillText(tr('plan missing','pelan tiada'),x+68,yy)}else{const rr=individualSchedule(p,yr);ctx.fillStyle='#b00020';ctx.font='900 30px system-ui';ctx.fillText(`${money(rr[0].price)}${tr('/mth','/bln')}`,x+68,yy);ctx.fillStyle='#555';ctx.font='600 17px system-ui';ctx.fillText(scheduleText(rr[0]),x+245,yy);if(rr[1]){ctx.fillStyle='#333';ctx.font='700 18px system-ui';ctx.fillText(`${scheduleText(rr[1])}: ${money(rr[1].price)}${tr('/mth','/bln')}`,x+68,yy+30)}}yy+=78;}
  }
  function drawCrossTotals(ctx,codes){
    ctx.fillStyle='#7b0018';roundRect(ctx,90,1240,1420,220,28,true);ctx.fillStyle='#fff';ctx.font='900 31px system-ui';ctx.fillText(tr('COMBINED TOTAL','JUMLAH KOMBO'),130,1290);let x=455;for(const yr of [5,7]){if((yr===5&&!posterDraft.show5)||(yr===7&&!posterDraft.show7))continue;const ps=codes.map(c=>findPlan(c,yr,'combine')||findPlan(c,yr,''));ctx.fillStyle='#ffd451';ctx.font='900 25px system-ui';ctx.fillText(`${yr} ${tr('YEARS','TAHUN')}`,x,1288);if(ps.every(Boolean)){const rr=combinedSchedule(ps,yr);ctx.fillStyle='#fff';ctx.font='900 43px system-ui';ctx.fillText(`${money(rr[0].price)}${tr('/mth','/bln')}`,x,1338);ctx.font='600 16px system-ui';let yy=1370;rr.slice(0,3).forEach(r=>{ctx.fillText(`${scheduleText(r)}  ${money(r.price)}${tr('/mth','/bln')}`,x,yy);yy+=25})}else{ctx.fillStyle='#fff';ctx.font='700 22px system-ui';ctx.fillText(tr('plans missing','pelan tidak lengkap'),x,1340)}x+=500;}
  }
  function drawFeatureFooter(ctx,y=1342,h=112){ctx.fillStyle='rgba(255,255,255,.94)';roundRect(ctx,52,y,1496,h,25,true);const labels=posterDraft.language==='ms'?['PENGHANTARAN & PEMASANGAN ASAS PERCUMA','WARANTI','COMBINE MAINTENANCE','HARGA TERKINI DALAM SISTEM']:['FREE DELIVERY & BASIC INSTALLATION','WARRANTY','COMBINE MAINTENANCE','CURRENT DATABASE PRICING'];ctx.fillStyle='#171717';ctx.textAlign='center';labels.forEach((t,i)=>{ctx.font='800 19px system-ui';ctx.fillText(t,240+i*380,y+66)});ctx.textAlign='left'}
  function drawContactFooter(ctx,y=1502){const who=[state.settings?.agentName||'Jason Yang',state.settings?.agentContact||'011-59726619'].filter(Boolean).join(' • ');ctx.fillStyle='#5b000f';roundRect(ctx,52,y,1496,68,22,true);ctx.fillStyle='#fff';ctx.font='800 30px system-ui';ctx.textAlign='center';ctx.fillText(who||'LG Subscribe',800,y+44);ctx.fillStyle='#555';ctx.font='17px system-ui';ctx.fillText(state.settings?.posterDisclaimer||(posterDraft.language==='ms'?'Imej untuk tujuan ilustrasi sahaja. Tertakluk kepada terma & syarat.':'Image for illustration purposes only. T&C apply.'),800,1592);ctx.textAlign='left'}
  function autoPosterTitle(){const p=getSelectedPlan(1);if(!p)return 'LG SUBSCRIBE';if(p.promoType==='percent')return `${p.promoValue}% OFF FIRST ${p.promoMonths||''} MONTHS`;if(p.promoType==='rm')return `SAVE RM${p.promoValue} EVERY MONTH`;return 'LG SUBSCRIBE'}
  function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill()}
  function drawCenteredWrapped(ctx,text,cx,y,maxWidth,lineHeight,maxLines){const words=text.split(/\s+/);let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines=lines.slice(0,maxLines);ctx.textAlign='center';lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lineHeight));ctx.textAlign='left'}
  async function drawPhysicalProduct(ctx,img,dim,x,y,w,h,forcedScale=null){
    if(!img){ctx.strokeStyle='#d1d5db';ctx.setLineDash([10,10]);ctx.strokeRect(x+20,y+20,w-40,h-40);ctx.setLineDash([]);ctx.fillStyle='#6b7280';ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillText('Product image needed',x+w/2,y+h/2);ctx.textAlign='left';return;}const b=trimTransparent(img);const scale=forcedScale||Math.min(w/dim.w,h/dim.h);const targetW=dim.w*scale,targetH=dim.h*scale;const imgRatio=b.sw/b.sh,boxRatio=targetW/targetH;let dw,dh;if(imgRatio>boxRatio){dw=targetW;dh=dw/imgRatio}else{dh=targetH;dw=dh*imgRatio}const dx=x+(w-dw)/2,dy=y+h-dh;ctx.save();ctx.shadowColor='rgba(0,0,0,.20)';ctx.shadowBlur=20;ctx.shadowOffsetY=12;ctx.drawImage(img,b.sx,b.sy,b.sw,b.sh,dx,dy,dw,dh);ctx.restore();
  }
  function drawProductName(ctx,p,cx,y,maxWidth=850){ctx.fillStyle='#202228';ctx.font='750 24px system-ui';ctx.textAlign='center';let text=`${p.description||p.category||''}  •  ${p.code}`;if(ctx.measureText(text).width>maxWidth)text=p.code;ctx.fillText(text,cx,y);ctx.textAlign='left'}
  function drawPriceCard(ctx,plan,x,y,w,h){ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='#e3e5e9';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,18);ctx.fill();ctx.stroke();if(!plan){ctx.fillStyle='#6b7280';ctx.font='22px system-ui';ctx.fillText('Add a price plan',x+24,y+55);return;}const promo=calcPromoPrice(plan);ctx.fillStyle='#b00020';ctx.font='800 42px system-ui';ctx.fillText(`${money(promo)}/month`,x+24,y+55);ctx.fillStyle='#222';ctx.font='700 19px system-ui';ctx.fillText(plan.promoType==='none'?'Current plan':promoText(plan),x+24,y+89);ctx.fillStyle='#6b7280';ctx.font='17px system-ui';ctx.fillText(`Normal ${money(plan.normalPrice)}/month • ${plan.planYears} years • ${plan.serviceType||''}`,x+24,y+119)}
  async function downloadAndRegisterPoster(){
    await generatePoster();const codes=[posterDraft.model1,...(posterDraft.template!=='single'&&posterDraft.model2?[posterDraft.model2]:[])].filter(Boolean);if(!codes.length){toast('Choose a model');return}const restricted=codes.filter(c=>posterAvailability(c,posterDraft.region).restricted);if(restricted.length&&!posterDraft.overrideRestricted){toast('Generation blocked: STOP Submission / Discontinued model selected.');return;}const canvas=document.getElementById('posterCanvas');const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));const fileName=`LG_Poster_${codes.map(c=>c.split('.')[0]).join('_')}_${new Date().toISOString().slice(0,10)}.png`;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);let cloudPosterPath=null;try{cloudPosterPath=await cloudUploadPoster(blob,fileName)}catch(e){console.warn(e)}const modelSnapshots={};codes.forEach(c=>{if(state.products[c])modelSnapshots[c]=modelFingerprint(state.products[c])});state.posters.push({id:uid('poster'),title:posterDraft.title||autoPosterTitle(),template:posterDraft.template,modelCodes:codes,planIds:[posterDraft.plan1,posterDraft.plan2].filter(Boolean),modelSnapshots,createdAt:nowIso(),status:'current',fileName,comboSettings:{show5:posterDraft.show5,show7:posterDraft.show7,region:posterDraft.region,language:posterDraft.language},availabilitySnapshot:Object.fromEntries(codes.map(c=>[c,posterAvailability(c,posterDraft.region)])),cloudPosterPath});saveState();toast('High-resolution poster downloaded and registered.');
  }

  function renderRevisions(view){
    const outdated=state.posters.filter(posterIsOutdated).slice().reverse();const current=state.posters.filter(p=>!posterIsOutdated(p)).slice().reverse();const attention=current.filter(p=>(p.modelCodes||[]).some(c=>posterAvailability(c,p.comboSettings?.region||'AL8').balance<=0));
    view.innerHTML=`<div class="card"><div class="card-title-row"><div><h2>Needs revision</h2><div class="small muted">A poster is flagged when a linked model, asset or price fingerprint changes.</div></div><span class="badge-num">${outdated.length}</span></div>
      ${outdated.length?outdated.map(p=>revisionHtml(p,true)).join(''):'<div class="empty-state"><b>No outdated posters</b>Generate and register posters in Poster Studio. Future changes will appear here.</div>'}
      </div><div class="card" style="margin-top:16px"><div class="card-title-row"><div><h2>Availability attention</h2><div class="small muted">Stock changes do not force a visual poster revision, but they are flagged here for sales use.</div></div><span class="badge-num">${attention.length}</span></div>${attention.length?attention.slice(0,20).map(p=>`<div class="revision-item"><div><h4>${esc(p.title||p.fileName||'Poster')}</h4><div class="small mono">${esc((p.modelCodes||[]).join(' + '))}</div><div class="revision-reason">${(p.modelCodes||[]).map(c=>`${modelShort(c)}: ${posterAvailability(c,p.comboSettings?.region||'AL8').text}`).join(' • ')}</div></div><span class="pill amber">Check stock</span></div>`).join(''):'<div class="empty-state">No stock attention for current posters.</div>'}</div><div class="card" style="margin-top:16px"><div class="card-title-row"><h2>Current registered posters</h2><span class="badge-num">${current.length}</span></div>${current.length?current.slice(0,20).map(p=>revisionHtml(p,false)).join(''):'<div class="empty-state">No current posters registered.</div>'}</div>`;
    view.querySelectorAll('[data-regenerate]').forEach(b=>b.onclick=()=>{
      const p=state.posters.find(x=>x.id===b.dataset.regenerate);if(!p)return;posterDraft.template=p.template||((p.modelCodes||[]).length>1?'combo':'single');posterDraft.model1=p.modelCodes?.[0]||'';posterDraft.model2=p.modelCodes?.[1]||'';posterDraft.plan1=p.planIds?.[0]||'';posterDraft.plan2=p.planIds?.[1]||'';posterDraft.title=p.title||'';navigate('posters');
    });
  }
  function revisionHtml(p,isBad){
    const reasons=(p.outdatedReasons||[]).slice(-3).map(r=>r.summary).filter(Boolean);return `<div class="revision-item"><div><h4>${esc(p.title||p.fileName||'Poster')}</h4><div class="small mono">${esc((p.modelCodes||[]).join(' + '))}</div><div class="${isBad?'revision-reason':'small muted'}">${isBad?esc(reasons.join(' • ')||'Linked product data no longer matches the poster snapshot.'):esc(`Generated ${fmtDate(p.createdAt)}`)}</div></div>${isBad?`<button class="btn btn-primary btn-sm" data-regenerate="${p.id}">Regenerate</button>`:'<span class="pill green">Current</span>'}</div>`;
  }

  function renderSettings(view){
    const s=state.settings||{};
    view.innerHTML=`
      <div class="grid settings-grid">
        <div class="card"><h2>Poster identity</h2><div class="field" style="margin-top:14px"><label>Name / business label</label><input id="agentName" class="input" style="width:100%" value="${esc(s.agentName||'')}"></div><div class="field" style="margin-top:10px"><label>Contact</label><input id="agentContact" class="input" style="width:100%" value="${esc(s.agentContact||'')}"></div><div class="field" style="margin-top:10px"><label>Footer disclaimer</label><input id="posterDisclaimer" class="input" style="width:100%" value="${esc(s.posterDisclaimer||'')}"></div><button id="saveSettings" class="btn btn-primary" style="margin-top:14px">Save settings</button></div>
        <div class="card"><h2>Data status</h2><div class="change-row"><b>Products</b><span>${Object.keys(state.products).length}</span><span>from stock report</span></div><div class="change-row"><b>Price plans</b><span>${state.pricePlans.length}</span><span>seeded + manual / future PDF import</span></div><div class="change-row"><b>Posters</b><span>${state.posters.length}</span><span>${revisionCount()} need revision</span></div><div class="change-row"><b>Source</b><span>${esc(state.sourceReport||'—')}</span><span>${esc(fmtDate(state.reportDate))}</span></div></div>
      </div>
      <div class="card" style="margin-top:16px"><h2>Reset local cache</h2><p class="small muted">This clears only this browser cache. Your cloud workspace remains intact and reloads after sign-in.</p><button id="resetPrototype" class="btn btn-danger">Reset to baseline</button></div>`;
    document.getElementById('saveSettings').onclick=()=>{state.settings={agentName:document.getElementById('agentName').value.trim(),agentContact:document.getElementById('agentContact').value.trim(),posterDisclaimer:document.getElementById('posterDisclaimer').value.trim()};saveState();toast('Settings saved.')};
    document.getElementById('resetPrototype').onclick=async()=>{if(!confirm('Clear this browser cache and reload from cloud?'))return;localStorage.removeItem(STORAGE_KEY);await clearAssets();if(cloudReady){await cloudLoadOrSeedState();await hydrateAllCloudAssetsToLocal();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}else state=loadState();render();toast(cloudReady?'Local cache reloaded from cloud.':'Local cache reset.')};
  }

  async function exportBackup(){
    const assets=await getAllAssets();const payload={format:'LGSubscribeControlCentreBackup',version:1,exportedAt:nowIso(),state,assets};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`LG_Control_Centre_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }
  async function importBackup(file){
    if(!file)return;try{const payload=JSON.parse(await file.text());if(!payload.state?.products)throw new Error('Invalid backup');state=payload.state;saveState();await clearAssets();for(const a of payload.assets||[])await putAsset(a.model,a.dataUrl,a.fileName);render();toast('Backup restored.')}catch(e){toast('Backup could not be restored.')}
  }

  document.getElementById('installAppBtn').addEventListener('click',handleInstallApp);
  document.getElementById('quickUpdateBtn').addEventListener('click',()=>navigate('update'));
  document.getElementById('exportBackupBtn').addEventListener('click',exportBackup);
  document.getElementById('importBackupInput').addEventListener('change',e=>importBackup(e.target.files[0]));

  async function seedBuiltinAssets(){
    const dims=window.__LG_CONFIRMED_DIMS__||{};for(const [code,d] of Object.entries(dims)){if(!state.products[code])continue;const p=state.products[code];p.dimensions=p.dimensions||{};if(d.width)p.dimensions.width=d.width;if(d.height)p.dimensions.height=d.height;if(d.depth)p.dimensions.depth=d.depth;p.dimensionSource=d.note||p.dimensionSource||'';}
    const built=window.__LG_BUILTIN_ASSETS__||{};for(const [code,a] of Object.entries(built)){if(!state.products[code])continue;const existing=await getAsset(code);if(!existing)await putAsset(code,a.dataUrl,a.fileName);const p=state.products[code];p.dimensions=p.dimensions||{};if(a.dimensions?.width)p.dimensions.width=a.dimensions.width;if(a.dimensions?.height)p.dimensions.height=a.dimensions.height;if(a.dimensions?.depth)p.dimensions.depth=a.dimensions.depth;p.imageApproved=true;p.assetNote=a.note||p.assetNote||'Seeded from supplied poster reference.';}
    const seedPlans=window.__LG_SEEDED_PRICE_PLANS__||[];
    state.pricePlans=state.pricePlans||[];
    for(const sp of seedPlans){ if(!state.pricePlans.some(p=>p.id===sp.id)) state.pricePlans.push({...sp}); }
    state.comboPresets=state.comboPresets||[];
    state.settings=state.settings||{};if(!state.settings.agentName)state.settings.agentName='Jason Yang';if(!state.settings.agentContact)state.settings.agentContact='011-59726619';if(!state.settings.posterDisclaimer)state.settings.posterDisclaimer='Imej untuk tujuan ilustrasi sahaja. Tertakluk kepada terma & syarat.';
    saveState();
  }
  render(); initCloudAuth().catch(e=>console.error(e)); seedBuiltinAssets().then(()=>render()).catch(e=>console.warn(e));
})();

</script>
