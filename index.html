<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b00020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LG Control">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>LG Subscribe Control Centre</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#17181b}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#111318,#2a0c14)}
    .card{width:min(460px,94vw);background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center}
    .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;background:linear-gradient(145deg,#e22933,#8c001b)}
    h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#667085;font-size:13px;line-height:1.5}
    .spinner{width:30px;height:30px;border:3px solid #eee;border-top-color:#b00020;border-radius:50%;margin:22px auto 0;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}button{margin-top:18px;border:0;border-radius:10px;background:#b00020;color:#fff;padding:11px 18px;font-weight:700}
  </style>
</head>
<body>
<div class="boot" id="boot"><div class="card"><div class="logo">LG</div><h1>LG Subscribe Control Centre</h1><p id="status">Opening your secure cloud workspace…</p><div class="spinner" id="spin"></div></div></div>
<script>
const SOURCE_URL='https://jmnnesumjpkraugtzdkl.supabase.co/storage/v1/object/public/app-static/d257117f-df44-4da3-b7cb-7d0b84e6e0e4/lg-control-centre/index.html';
async function boot(){
  try{
    const r=await fetch(SOURCE_URL,{cache:'no-store'});
    if(!r.ok) throw new Error('Source returned '+r.status);
    let html=await r.text();
    html=html.replace(
      "function isPublishedPwaLocation(){return location.protocol==='https:'&&location.pathname.includes('/storage/v1/object/public/app-static/');}",
      "function isPublishedPwaLocation(){return location.protocol==='https:';}"
    );
    html=html.replaceAll('./icon-192.png','./icon.svg').replaceAll('./icon-512.png','./icon.svg');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').textContent='Could not open the app: '+(e.message||e);
    document.getElementById('spin').outerHTML='<button onclick="location.reload()">Retry</button>';
  }
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
boot();
</script>
</body>
</html>
